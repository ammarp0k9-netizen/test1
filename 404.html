<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LootLingua</title>

  <script>
    (function () {
      var location = window.location;
      var parts = location.pathname.split('/').filter(Boolean);
      var isGitHubPages = location.hostname.endsWith('.github.io');

      var projectBase = isGitHubPages && parts.length
        ? '/' + parts[0]
        : '';

      var routeParts = isGitHubPages
        ? parts.slice(1)
        : parts;

      var route = '/' + routeParts.join('/');

      var params = new URLSearchParams();
      params.set('p', route || '/');

      if (location.search) {
        params.set('q', location.search.slice(1));
      }

      // GitHub Pages cannot define rewrites. Send app/deep links directly to
      // the app document so the public landing page never consumes `p`.
      location.replace(
        location.origin +
        projectBase +
        '/index.html?' +
        params.toString() +
        location.hash
      );
    })();
  </script>
</head>

<body></body>
</html>
